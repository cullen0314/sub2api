name: Docker GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish, for example c206b7e6"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}" \
            .
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api:${{ inputs.image_tag }}

      - name: Push image
        run: docker push "${IMAGE}"
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api:${{ inputs.image_tag }}

      - name: Save image artifact
        run: docker save "${IMAGE}" | gzip > "/tmp/sub2api-${IMAGE_TAG}.tar.gz"
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sub2api:${{ inputs.image_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-${{ inputs.image_tag }}-docker-image
          path: /tmp/sub2api-${{ inputs.image_tag }}.tar.gz
          retention-days: 1
